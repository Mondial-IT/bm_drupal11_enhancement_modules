bm_aggrid.settings:
  type: config_object
  label: 'AG Grid display settings'
  mapping:
    display_configs:
      type: sequence
      label: 'Grid configurations'
      sequence:
        type: mapping
        mapping:
          id:
            type: string
            label: 'Configuration ID'
          label:
            type: label
            label: 'Label'
          entity_type:
            type: string
            label: 'Entity type'
          bundle:
            type: string
            label: 'Bundle'
          fields:
            type: sequence
            label: 'Field machine names'
            sequence:
              type: string
          page_size:
            type: integer
            label: 'Rows per page'
          options:
            type: bm_aggrid.grid_options

bm_aggrid.grid_options:
  type: mapping
  label: 'AG Grid options'
  mapping:
    theme:
      type: string
      label: 'AG Grid theme'
    row_height:
      type: integer
      label: 'Row height'
    enable_pagination:
      type: boolean
      label: 'Enable pagination'
    pagination_page_size:
      type: integer
      label: 'Pagination size'
